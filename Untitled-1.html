<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="/css/w6.css">
</head>
<body>

<!--第六周練習-->
<!--通用選擇器 -->
Hello, world!
<h1>Hello, world!</h1>
<p>Hello, world!</p>
<!--類型(標籤)選擇器 -->
<p>文字大小 24px</p>
<!--ID選擇器 -->
<div id="Raccoon">文字大小 24px</div>
<!--類別(class)選擇器 -->
<h1 class="hahaha">置中對齊</h1>
<p class="hahaha">置中對齊</p>
<!--群組(多個標籤)選擇器 -->
<p>字體為藍色</p>
<h1>字體為藍色</h1>
<h2>字體為藍色</h2>
<!--後代選擇器 -->
<footer>
<p>版權所有</p>
<h1>版權所有</h1>
<h1>版權所有</h1>
</footer>
<!--子選擇器 -->
<h1>Hello, world!</h1>
<h1 style="color:black;text-align: center;font-size: 100px;">Hello, world!</h1>

</body>
</html>
